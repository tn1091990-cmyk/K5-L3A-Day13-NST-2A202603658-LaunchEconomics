# Kết quả D1 (baseline 0.70, mục tiêu +5 điểm -> 0.75, alpha 0.05, power 0.80, ICC 0.02):
# - D1.a Chia theo từng yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels cho 1.250).
# - D1.b Chia theo nhân viên, m = 75 yêu cầu/người: DE = 1 + 74 * 0.02 = 2.48 -> 3.103 yêu cầu/nhóm -> 42 NV/nhóm (tổng 84 > 40 NV hiện có: không đủ người).
# - D1.c Chia theo nhân viên, 20 NV/nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0.02 = 1.000 < 1.251 (không bao giờ đạt mức chênh 5 điểm).
# - D1.d Chia theo depot, 6 depot/nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0.02 = 300 < 1.251 và dưới 20 cụm/nhóm (loại).
# - D1.e Chấp nhận mức chênh 6 điểm (n = 859/nhóm), 20 NV/nhóm: m >= 299 yêu cầu mỗi nhân viên (DE = 6.96). Nếu tác động thật chỉ 5 điểm, power giảm còn ~0.64.
#
# Kết quả D2 (5 câu kiểm tra tách được tác động):
# 1. Đối chứng chạy cùng thời gian: Có, 20 NV đối chứng làm việc song song cùng tuần, cùng depot.
# 2. Chia ngẫu nhiên hay người chọn: Ngẫu nhiên bằng code với seed cố định trước, phân tầng theo depot.
# 3. Ảnh hưởng gián tiếp: Có nguy cơ chia sẻ mẫu câu trả lời trong cùng depot; giảm bằng phân quyền theo tài khoản và ghi log theo staff_id.
# 4. Viết trước khi chạy: Có, chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày chạy.
# 5. Ít nhất 20 cụm mỗi nhóm: Có, 20 nhân viên/nhóm.
#
# Kiểm tra tỉ lệ mở lại hiện tại: mo_lai_trong_7_ngay = 4.25% (51/1.200 toàn mẫu; 3.97% trong noi_dia + hang_nang).
# Nếu đặt ngưỡng dừng 1-2% thì pilot dừng ngay tuần đầu; do đó cần xem lại 100% ở bước 0.10 và dùng ngưỡng chênh >= +2 điểm so với đối chứng kèm trần 6%.

